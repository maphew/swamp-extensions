manifestVersion: 1
name: "@maphew/repo-doctor"
version: 2026.10.15.2
description: >-
  Repository hygiene checks for swamp repos — hardcoded absolute home paths in
  model/workflow sources, pulled extensions whose source files are missing, and
  generated .swamp artifacts not covered by .gitignore. Writes a combined
  markdown report plus per-check structured resources.
repository: "https://github.com/maphew/swamp-extensions.git"
license: MIT
paths:
  base: manifest
models:
  - src/repo_doctor.ts
workflows: []
vaults: []
datastores: []
reports: []
additionalFiles:
  - README.md
  - LICENSE
platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-x86_64
  - darwin-aarch64
labels:
  - repo
  - hygiene
  - doctor
  - portability
  - gitignore
dependencies: []
