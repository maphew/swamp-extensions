manifestVersion: 1
name: "@maphew/kilo-code-project"
version: 2026.10.15.2
description: >-
  Discover and summarize Kilo Code CLI configuration for a project — commands,
  agents, skills, instruction files, permissions, MCPs, config files, and Agent
  Manager state — without running Kilo or mutating project files. Optional
  secret redaction by default.
repository: "https://github.com/maphew/swamp-extensions.git"
license: MIT
paths:
  base: manifest
models:
  - src/kilo_project.ts
workflows: []
vaults: []
datastores: []
reports: []
additionalFiles:
  - README.md
  - LICENSE
platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-x86_64
  - darwin-aarch64
labels:
  - kilo
  - agent
  - inventory
  - config
  - ai-tools
dependencies: []
