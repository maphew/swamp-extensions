manifestVersion: 1
name: "@maphew/swamp-tide"
version: 2026.10.08.3
description: >-
  Troll the swamp club activity logs to find when people (and
  their agents) are participating. Collects the club feed into a
  normalized event stream, then buckets it into a 7x24
  participation heatmap with peak-slot detection,
  hour-of-day / weekday / day-of-month / daily trajectory
  charts, and a markdown tide report. Scheduled hourly by the
  companion swamp-tide workflow. Ships tide-view, a viewer
  that renders the latest report as a themed HTML page.
repository: "https://github.com/maphew/swamp-extensions.git"
paths:
  base: manifest
models:
  - src/swamp_tide.ts
workflows: []
vaults: []
datastores: []
reports: []
additionalFiles:
  - README.md
  - LICENSE
binaries:
  - tide-view.mjs
platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-x86_64
  - darwin-aarch64
labels:
  - swamp-club
  - activity
  - analytics
  - heatmap
  - participation
dependencies: []
