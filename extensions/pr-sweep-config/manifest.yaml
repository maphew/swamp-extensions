workflows: []
vaults: []
datastores: []
reports: []
additionalFiles:
  - README.md
  - LICENSE
platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-x86_64
  - darwin-aarch64
labels:
  - pr
  - github
  - config
  - automation
dependencies: []
