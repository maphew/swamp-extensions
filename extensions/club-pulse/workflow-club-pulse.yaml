id: a0ce58fc-b119-4f40-8e8f-ea13a70b054b
name: "@maphew/club-pulse"
description: >-
  Sample the tracked Swamp Club member's points on a fixed cadence and refresh
  the minute / hour / day pulse report. Sampling cadence bounds bucket
  resolution — at 5-minute sampling the minute table shows 5-minute steps.
  Requires a model instance named club-pulse with the username global arg set.
version: 1
trigger:
  schedule: "*/5 * * * *"
jobs:
  - name: pulse
    description: Append a club-points sample and rebuild the bucketed pulse report
    steps:
      - name: sample
        description: Fetch and append the current club-points snapshot
        task:
          type: model_method
          modelIdOrName: club-pulse
          methodName: sample
      - name: refresh
        description: Bucket recorded samples into minute / hour / day deltas
        task:
          type: model_method
          modelIdOrName: club-pulse
          methodName: pulse
        dependsOn:
          - step: sample
            condition:
              type: succeeded
