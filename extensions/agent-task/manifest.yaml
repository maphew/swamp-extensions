manifestVersion: 1
name: "@maphew/agent-task"
version: "2026.10.15.1"
description: >-
  Headless agent dispatch as a swamp behavior: filter the bd ready queue into a
  typed manifest, branch a target checkout and run one agent on a task, or sweep
  every candidate under a single behavior lock. Replaces the .kilo/agents
  ready-queue.sh / run-task.sh / bd-sweep.sh shell cluster.
repository: "https://github.com/maphew/swamp-extensions.git"
license: MIT
paths:
  base: manifest
models:
  - src/agent_task.ts
additionalFiles:
  - README.md
  - LICENSE
platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-x86_64
  - darwin-aarch64
labels:
  - agent
  - dispatch
  - beads
  - git
  - automation
dependencies: []
