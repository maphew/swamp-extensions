manifestVersion: 1
name: "@maphew/handoff"
version: 2026.10.15.4
description: >-
  Exact-state engineering handoffs. Captures a deterministic, secret-free
  snapshot of Git worktree state plus the authoritative active Bead, records the
  narrative (goal, scope, commands, decisions, next safe step, forbidden
  operations), and writes a queryable handoff resource and a markdown report.
repository: "https://github.com/maphew/swamp-extensions.git"
license: MIT
paths:
  base: manifest
models:
  - src/handoff.ts
additionalFiles:
  - README.md
  - LICENSE
platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-x86_64
  - darwin-aarch64
labels:
  - handoff
  - git
  - beads
  - session
  - resume
dependencies: []
