manifestVersion: 1
name: "@maphew/pr-sweep"
version: 2026.10.18.1
description: >-
  Sweep open pull requests a fork contributes to an upstream GitHub repo.
  Composable steps — list, review (one agent per batch), sync, verdicts,
  summary — so an orchestrator (Ceph, a foreman agent, a workflow, or you)
  plans the work and delegates it, while `sweep` remains as the one-call
  convenience. Queryable per-PR and run-summary resources; the sweeper prompt
  ships as a bundled asset.
repository: "https://github.com/maphew/swamp-extensions.git"
license: MIT
paths:
  base: manifest
models:
  - src/pr_sweep.ts
workflows: []
vaults: []
datastores: []
reports: []
additionalFiles:
  - README.md
  - LICENSE
  - prompts/pr-sweeper.md
platforms:
  - linux-x86_64
  - linux-aarch64
  - darwin-x86_64
  - darwin-aarch64
labels:
  - pr
  - github
  - automation
  - review
  - merge
dependencies:
  - "@maphew/agent-task"
